[project]
name = "f916-watch"
version = "0.2.0"
description = "1F916 Watch — public read-only citizen windows (https://f916-watch.fly.dev)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
f916 = "f916_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
f916_agent = ["watch_ui.html", "treasury_ui.html", "trust_ui.html", "listings_ui.html", "grants_ui.html", "favicon.svg", "chat.js", "watchlist.js"]
